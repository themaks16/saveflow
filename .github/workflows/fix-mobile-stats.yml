name: Fix mobile stats layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-mobile-stats:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply mobile stats layout fix
        shell: bash
        run: |
          cat >> src/App.css <<'EOF'

/* SaveFlow mobile stats overflow fix */
@media (max-width: 520px) {
  .stats-grid {
    display: flex !important;
    flex-direction: column !important;
    width: 100% !important;
    gap: 10px !important;
    margin-left: 0 !important;
    margin-right: 0 !important;
  }

  .stats-grid .stat.card {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    margin: 0 !important;
    padding: 17px 16px !important;
    overflow: hidden !important;
  }

  .stats-grid .stat h3 {
    white-space: normal !important;
    overflow-wrap: anywhere !important;
    word-break: break-word !important;
    font-size: 25px !important;
  }

  .stats-grid .stat span,
  .stats-grid .stat small {
    min-width: 0 !important;
    overflow-wrap: anywhere !important;
  }
}
EOF

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.css
          git diff --cached --quiet || git commit -m "Fix mobile income and savings cards"
          git push